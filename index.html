<!DOCTYPE html>
<html lang="or">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090313">
<title>ଶୁଭ ଦୀପାବଳି | Deltatech & Associates</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#090313; }
body { color:#fff; font-family: Georgia, "Noto Serif Oriya", serif; }
.scene {
  width:100%; height:100dvh; min-height:100vh; max-width:520px; margin:auto;
  position:relative; overflow:hidden; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center;
  background:radial-gradient(circle at 50% 45%, #64220c 0%, #21091d 48%, #070313 100%);
}
canvas { position:absolute; inset:0; width:100%; height:100%; }
.content { position:relative; z-index:2; padding:22px; width:100%; animation:appear 1.8s ease both; }
.brand { font-family:Arial,sans-serif; letter-spacing:4px; font-size:12px; color:#ffd77b; margin-bottom:34px; }
.small { font-size:15px; color:#ffe0a1; letter-spacing:2px; }
h1 {
  font-size:clamp(48px, 14vw, 76px); line-height:1.15; color:#ffe3a0; margin:17px 0;
  text-shadow:0 0 20px #ff9e25, 0 0 55px #ff6a00;
  animation:glow 2s infinite alternate;
}
.divider { width:110px; height:2px; background:linear-gradient(90deg,transparent,#ffcf67,transparent); margin:22px auto; }
.message {
  font-size:clamp(22px, 6vw, 29px); line-height:1.85; font-weight:bold;
  color:#fff0c5; text-shadow:0 0 15px #ff8c00, 0 2px 3px #210900;
}
.diya { font-size:68px; margin-top:24px; filter:drop-shadow(0 0 22px #ff8c00); animation:flicker 1.5s infinite alternate; }
.footer { font-family:Arial,sans-serif; font-size:10px; letter-spacing:2px; color:#d9ad70; margin-top:28px; line-height:1.8; }
@keyframes appear { from {opacity:0; transform:translateY(25px)} to {opacity:1; transform:translateY(0)} }
@keyframes glow { from {text-shadow:0 0 15px #ff8b20} to {text-shadow:0 0 35px #ffd46a,0 0 75px #ff6500} }
@keyframes flicker { from {transform:scale(.96)} to {transform:scale(1.08)} }
</style>
</head>
<body>
<div class="scene">
  <canvas id="fireworks" aria-hidden="true"></canvas>
  <main class="content">
    <div class="brand">DELTATECH &amp; ASSOCIATES</div>
    <div class="small">ଆସିଗଲା ଆଲୋକର ପର୍ବ 🪔</div>
    <h1>ଶୁଭ<br>ଦୀପାବଳି</h1>
    <div class="divider"></div>
    <div class="message">
      କାଳୀପୂଜାରେ<br>
      ଝୁମର ଅଛି ବେ! 😂<br><br>
      ମାଟିରେ ଗଡ଼ିଯିବା! 🤣<br><br>
      ଦୀପାବଳିର ମଜା<br>
      ନେଇଯିବା! 🎆
    </div>
    <div class="diya">🪔</div>
    <div class="footer">HAVE FUN • CELEBRATE • SPREAD LIGHT</div>
  </main>
</div>
<script>
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");
let particles = [];
let dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));

function resize() {
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.floor(rect.width * dpr);
  canvas.height = Math.floor(rect.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

function burst(x, y) {
  const colors = ["#ffd166", "#ff8c42", "#fff0b3", "#ffcf5c", "#ff6b35"];
  for (let i = 0; i < 65; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 3 + 0.7;
    particles.push({
      x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      life: 1, decay: 0.009 + Math.random() * 0.009,
      size: 1 + Math.random() * 2,
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }
}

function animate() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  ctx.clearRect(0, 0, w, h);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.025; p.life -= p.decay;
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    if (p.life <= 0) particles.splice(i, 1);
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(animate);
}
animate();

function randomBurst() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  burst(25 + Math.random() * (w - 50), 30 + Math.random() * h * 0.48);
}
setInterval(randomBurst, 850);
setTimeout(randomBurst, 250);
setTimeout(randomBurst, 650);
</script>
</body>
</html>
